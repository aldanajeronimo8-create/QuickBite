name: One-time QuickBite repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-roles-and-operations.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python3 scripts/repair-roles-and-operations.py

      - name: Commit and clean helper files
        run: |
          rm -f scripts/repair-roles-and-operations.py .github/workflows/one-time-repair.yml
          if git diff --quiet; then
            echo 'No source changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify parent student experience and operational flows'
          git push
