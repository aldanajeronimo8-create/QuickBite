name: One-time payment normalization

on:
  push:
    branches:
      - fix/payment-flow-breb

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payment flow
        run: |
          python -c "from pathlib import Path; p=Path('src/app/pages/student/StudentMenuPage.tsx'); s=p.read_text(); old=\"const paymentOptions = [\\n  { value: 'nequi', label: 'Nequi', hint: 'Referencia digital', accent: 'bg-fuchsia-500' },\\n  { value: 'bancolombia', label: 'Bancolombia', hint: 'Transferencia escolar', accent: 'bg-yellow-500' },\\n  { value: 'daviplata', label: 'Daviplata', hint: 'Pago digital', accent: 'bg-red-500' },\\n  { value: 'cash', label: 'Efectivo', hint: 'Pago al recoger', accent: 'bg-emerald-500' },\\n] as const;\"; new=\"const paymentOptions = [\\n  { value: 'nequi', label: 'Nequi', hint: 'Referencia digital', accent: 'bg-fuchsia-500' },\\n  { value: 'bre-b', label: 'Bre-B', hint: 'Transferencia digital', accent: 'bg-blue-500' },\\n  { value: 'cash', label: 'Efectivo', hint: 'Pago al recoger', accent: 'bg-emerald-500' },\\n] as const;\"; assert old in s; s=s.replace(old,new,1); s=s.replace(\"status: paymentMethod === 'cash' ? 'pending' : 'preparing',\",\"status: 'pending',\",1); s=s.replace(\"payment_status: paymentMethod === 'cash' ? 'pending' : 'confirmed',\",\"payment_status: 'pending',\",1); p.write_text(s); q=Path('src/app/pages/admin/AdminPaymentsFixed.tsx'); t=q.read_text(); t=t.replace(\"import type { Order } from '../../../lib/supabase';\",\"import { requireSupabaseClient, type Order } from '../../../lib/supabase';\",1); t=t.replace(\"const { orders, updateOrder } = useDataStore();\",\"const { orders, loadData } = useDataStore();\",1); oldv=\"try { await updateOrder(verificationOrder.id, { payment_status: status }); toast.success(status === 'confirmed' ? 'Pago verificado y confirmado.' : 'Pago verificado y rechazado.'); setVerificationOrder(null); }\"; newv=\"try { const { error } = await requireSupabaseClient().rpc('admin_update_order_payment', { p_order_id: verificationOrder.id, p_payment_status: status }); if (error) throw error; await loadData({ silent: true }); toast.success(status === 'confirmed' ? 'Pago verificado y confirmado.' : 'Pago verificado y rechazado.'); setVerificationOrder(null); }\"; assert oldv in t; t=t.replace(oldv,newv,1); oldl=\"const paymentLabel = (method: string) => method === 'cash' ? 'Efectivo' : method === 'bre-b' ? 'Bre-B' : method;\"; newl=\"const paymentLabel = (method: string) => { if (method === 'cash') return 'Efectivo'; if (method === 'nequi') return 'Nequi'; if (method === 'bre-b' || method === 'bancolombia' || method === 'daviplata' || method === 'bank_keys') return 'Bre-B'; return method; };\"; assert oldl in t; t=t.replace(oldl,newl,1); q.write_text(t); m=Path('supabase/migrations/20260830002000_fix_payment_verification_flow_and_breb.sql'); m.parent.mkdir(parents=True,exist_ok=True); m.write_text(\"create or replace function public.admin_update_order_payment(p_order_id uuid, p_payment_status text) returns uuid language plpgsql security definer set search_path = public as $$ declare v_order public.orders%rowtype; v_item record; begin if auth.uid() is null or not public.is_admin() then raise exception 'not_authorized'; end if; if p_payment_status not in ('confirmed','rejected') then raise exception 'invalid_payment_status'; end if; select * into v_order from public.orders where id=p_order_id for update; if not found then raise exception 'order_not_found'; end if; if v_order.payment_status <> 'pending' then raise exception 'payment_already_processed'; end if; update public.orders set payment_status=p_payment_status, status=case when p_payment_status='confirmed' then 'preparing' else 'pending' end, pickup_code=case when p_payment_status='rejected' then null else pickup_code end where id=p_order_id; if p_payment_status='rejected' then for v_item in select product_id, quantity from public.order_items where order_id=p_order_id loop update public.products set stock=stock+v_item.quantity where id=v_item.product_id; end loop; end if; return p_order_id; end; $$; revoke all on function public.admin_update_order_payment(uuid,text) from public; grant execute on function public.admin_update_order_payment(uuid,text) to authenticated;\"); Path('.github/workflows/one-time-payment-fix.yml').unlink()"
      - name: Commit normalized payment flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/student/StudentMenuPage.tsx src/app/pages/admin/AdminPaymentsFixed.tsx supabase/migrations/20260830002000_fix_payment_verification_flow_and_breb.sql .github/workflows/one-time-payment-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore Bre-B and payment verification flow"
          git push
