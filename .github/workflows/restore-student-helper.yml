name: Restore Student visual helper
on:
  push:
    branches:
      - feat/liquid-glass-ui

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/student/StudentMenuPage.tsx')
          s = p.read_text()
          if 'const futurePickupSlots = useMemo' not in s:
              marker = "  const [selectedPickupSlotId, setSelectedPickupSlotId] = useState<string | null>(null);\n"
              helper = marker + "\n  const futurePickupSlots = useMemo(() => {\n    const now = new Date();\n    return pickupSlots.filter((slot) => {\n      const [hour, minute, second = 0] = slot.starts_at.split(':').map(Number);\n      const candidate = new Date();\n      candidate.setHours(hour, minute, second, 0);\n      return candidate.getTime() >= now.getTime();\n    });\n  }, [pickupSlots]);\n"
              if marker not in s:
                  raise SystemExit('marker not found')
              p.write_text(s.replace(marker, helper, 1))
          PY
          git rm .github/workflows/restore-student-helper.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/student/StudentMenuPage.tsx
          git commit -m "fix: restore Student pickup slot helper" || true
          git push
