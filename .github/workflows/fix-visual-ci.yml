name: Normalize Student visual slot expression
on:
  push:
    branches:
      - feat/liquid-glass-ui

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize pickup slot render expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/student/StudentMenuPage.tsx')
          s = p.read_text()
          old = '{futurePickupSlots.map((slot) =>'
          new = "{pickupSlots.filter((slot: PickupSlot) => { const [hour, minute, second = 0] = slot.starts_at.split(':').map(Number); const candidate = new Date(); candidate.setHours(hour, minute, second, 0); return candidate.getTime() >= Date.now(); }).map((slot) =>"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/fix-visual-ci.yml || true
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/student/StudentMenuPage.tsx
          git commit -m "fix: keep Student pickup slot filter stable" || true
          git push
