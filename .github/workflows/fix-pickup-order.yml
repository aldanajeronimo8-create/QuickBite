name: Targeted pickup order fix
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Student checkout scheduling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/student/StudentMenuPage.tsx')
          s = p.read_text()
          s = s.replace("  const [selectedPickupSlotId, setSelectedPickupSlotId] = useState<string | null>(null);", "  const [selectedPickupSlotId, setSelectedPickupSlotId] = useState<string | null>(null);\n\n  const futurePickupSlots = useMemo(() => {\n    const now = new Date();\n    return pickupSlots.filter((slot) => {\n      const [hour, minute, second = 0] = slot.starts_at.split(':').map(Number);\n      const candidate = new Date();\n      candidate.setHours(hour, minute, second, 0);\n      return candidate.getTime() >= now.getTime();\n    });\n  }, [pickupSlots]);")
          s = s.replace("          if (slots?.length) setSelectedPickupSlotId(slots[0].id);", "          if (slots?.length) {\n            const now = new Date();\n            const nextSlot = slots.find((slot) => {\n              const [hour, minute, second = 0] = slot.starts_at.split(':').map(Number);\n              const candidate = new Date();\n              candidate.setHours(hour, minute, second, 0);\n              return candidate.getTime() >= now.getTime();\n            });\n            setSelectedPickupSlotId(nextSlot?.id ?? null);\n          }")
          s = s.replace("      if (selectedPickupSlotId) {\n        const slot = pickupSlots.find((item) => item.id === selectedPickupSlotId);\n        if (slot) await scheduleOrderForUser(orderNumber, student.id, slot.id, scheduledIsoForToday(slot.starts_at));\n      }", "      if (selectedPickupSlotId) {\n        const slot = pickupSlots.find((item) => item.id === selectedPickupSlotId);\n        if (slot) {\n          const scheduledFor = scheduledIsoForToday(slot.starts_at);\n          if (new Date(scheduledFor).getTime() >= Date.now()) {\n            await scheduleOrderForUser(orderNumber, student.id, slot.id, scheduledFor);\n          }\n        }\n      }")
          s = s.replace("{pickupSlots.map((slot) =>", "{futurePickupSlots.map((slot) =>")
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/student/StudentMenuPage.tsx .github/workflows/fix-pickup-order.yml
          git commit -m "fix: prevent past pickup slot from failing orders"
          git rm .github/workflows/fix-pickup-order.yml
          git commit -m "chore: remove temporary pickup patch workflow"
          git push