name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dependency-security-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dependency-security-audit.yml'

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency vulnerabilities
        run: pnpm audit --audit-level high
