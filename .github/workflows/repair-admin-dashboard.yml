name: Repair AdminDashboard build

on:
  push:
    branches:
      - integrate/quickbite-production-safe

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair AdminDashboard imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/admin/AdminDashboard.tsx')
          s = p.read_text()
          s = s.replace("import type { SystemHealthCheck } from '../../../lib/supabase';\n", "import { requireSupabaseClient } from '../../../lib/supabase';\n\ntype SystemHealthCheck = {\n  service: string;\n  status: 'healthy' | 'degraded' | 'unhealthy';\n  latency_ms: number | null;\n  checked_at: string;\n};\n")
          s = s.replace("import { getSystemHealthSummary } from '../../../repositories/quickbiteRepository';\n", "")
          s = s.replace("        const currentHealth = await getSystemHealthSummary();\n        if (active) setHealth(currentHealth);", "        const { data, error } = await requireSupabaseClient()\n          .from('system_health_checks')\n          .select('service,status,latency_ms,checked_at')\n          .order('checked_at', { ascending: false })\n          .limit(20);\n        if (error) throw error;\n        const currentHealth = (data ?? []) as SystemHealthCheck[];\n        if (active) setHealth(currentHealth);")
          p.write_text(s)
          PY
      - name: Remove repair workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/repair-admin-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/admin/AdminDashboard.tsx .github/workflows/repair-admin-dashboard.yml
          git commit -m "fix(admin): repair dashboard health imports" || exit 0
          git push
