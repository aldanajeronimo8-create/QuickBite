name: Fix Student slot reference
on:
  push:
    branches:
      - feat/liquid-glass-ui
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Student pickup slot rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/student/StudentMenuPage.tsx')
          s = p.read_text()
          old = "{pickupSlots.filter((slot: PickupSlot) => { const [hour, minute, second = 0] = slot.starts_at.split(':').map(Number); const candidate = new Date(); candidate.setHours(hour, minute, second, 0); return candidate.getTime() >= Date.now(); }).map((slot) =>"
          new = "{pickupSlots.filter((slot: PickupSlot) => { const [hour, minute, second = 0] = slot.starts_at.split(':').map(Number); const candidate = new Date(); candidate.setHours(hour, minute, second, 0); return candidate.getTime() >= Date.now(); }).map((slot: PickupSlot) =>"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'futurePickupSlots.map((slot) =>' in s:
              s = s.replace('futurePickupSlots.map((slot) =>', 'pickupSlots.filter((slot: PickupSlot) => { const [hour, minute, second = 0] = slot.starts_at.split(\':\').map(Number); const candidate = new Date(); candidate.setHours(hour, minute, second, 0); return candidate.getTime() >= Date.now(); }).map((slot: PickupSlot) =>', 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-student-slot-reference.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/student/StudentMenuPage.tsx .github/workflows/fix-student-slot-reference.yml
          git diff --cached --quiet || git commit -m "fix: normalize Student pickup slot type"
          git push
