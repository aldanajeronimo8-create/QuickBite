name: Lockfile Repair

on:
  push:
    paths:
      - package.json
      - .github/workflows/lockfile-repair.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): refresh pnpm lockfile"
          git push
      - name: Upload generated lockfile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-pnpm-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
