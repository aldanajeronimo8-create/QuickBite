name: Temporary legacy export fix
on:
  push:
    branches:
      - fix/admin-student-stability
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix legacy export await
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/admin/AdminOrders.tsx')
          s = p.read_text()
          old = 'const result = downloadActiveSalesExcel(orders);'
          new = 'const result = await downloadActiveSalesExcel(orders);'
          if old not in s:
              raise SystemExit('legacy export call not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/fix-legacy-export-await.yml').unlink(missing_ok=True)
          PY
      - name: Commit one-line fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/admin/AdminOrders.tsx .github/workflows/fix-legacy-export-await.yml
          git commit -m "fix: await legacy admin export"
          git push
