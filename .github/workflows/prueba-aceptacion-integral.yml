name: QuickBite — Prueba de Aceptación Integral

# Final production gate.
# Invoked only by the successful Integrity audit so the approved SHA is explicit.

on:
  workflow_call:
    inputs:
      sha:
        description: 'Exact commit SHA approved by the Integrity audit'
        required: true
        type: string
      exhaustive_run_id:
        description: 'Exact upstream exhaustive-audit run id; use 0 for manual dispatch'
        required: false
        type: number
        default: 0
    secrets:
      VITE_SUPABASE_ANON_KEY:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      PLAYWRIGHT_E2E_EMAIL:
        required: true
      PLAYWRIGHT_E2E_PASSWORD:
        required: true
      PLAYWRIGHT_ADMIN_EMAIL:
        required: true
      PLAYWRIGHT_ADMIN_PASSWORD:
        required: true
      PLAYWRIGHT_PARENT_EMAIL:
        required: true
      PLAYWRIGHT_PARENT_PASSWORD:
        required: true
      PLAYWRIGHT_STAFF_EMAIL:
        required: true
      PLAYWRIGHT_STAFF_PASSWORD:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: quickbite-integral-acceptance-${{ inputs.sha }}
  cancel-in-progress: false

env:
  SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
  PRODUCTION_URL: ${{ vars.K6_BASE_URL || 'https://quick-bite-snowy-ten.vercel.app' }}

jobs:
  resolve:
    name: Resolve approved SHA and previous evidence
    if: ${{ inputs.sha != '' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ci: ${{ steps.evidence.outputs.ci }}
      exhaustive: ${{ steps.evidence.outputs.exhaustive }}
    steps:
      - name: Resolve exact SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ inputs.sha }}"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Acceptance SHA: $sha"

      - name: Verify prior CI and exhaustive audit conclusions for this exact SHA
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
          EXHAUSTIVE_RUN_ID: ${{ inputs.exhaustive_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_runs() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$SHA&per_page=100"
          }

          conclusion_for() {
            printf '%s' "$1" | jq -r --arg w "$2" --arg sha "$SHA" '
              [.workflow_runs[] | select(.name == $w and .head_sha == $sha)]
              | sort_by(.run_started_at) | reverse | .[0].conclusion // "missing"
            '
          }

          json="$(fetch_runs)"
          ci="$(conclusion_for "$json" "CI")"
          echo "CI => $ci" >&2

          exhaustive="missing"
          direct_audit=false
          if [[ "$EXHAUSTIVE_RUN_ID" =~ ^[0-9]+$ ]] && [ "$EXHAUSTIVE_RUN_ID" -gt 0 ]; then
            direct_audit=true
            audit_json=""
            for attempt in 1 2 3 4 5; do
              if audit_json="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPOSITORY/actions/runs/$EXHAUSTIVE_RUN_ID")"; then
                break
              fi
              echo "Exact exhaustive run $EXHAUSTIVE_RUN_ID was not readable at attempt $attempt" >&2
              sleep "$attempt"
            done
            if [ -n "$audit_json" ]; then
              audit_name="$(printf '%s' "$audit_json" | jq -r '.name // ""')"
              audit_sha="$(printf '%s' "$audit_json" | jq -r '.head_sha // ""')"
              audit_branch="$(printf '%s' "$audit_json" | jq -r '.head_branch // ""')"
              exhaustive="$(printf '%s' "$audit_json" | jq -r '.conclusion // "missing"')"
              echo "Auditoría Exhaustiva QuickBite run #$EXHAUSTIVE_RUN_ID => $exhaustive (SHA $audit_sha; branch $audit_branch)" >&2
              if [ "$audit_name" != "Auditoría Exhaustiva QuickBite" ] ||
                 [ "$audit_sha" != "$SHA" ] ||
                 [ "$audit_branch" != "main" ] ||
                 [ "$exhaustive" != "success" ]; then
                echo "Exact upstream exhaustive-audit evidence does not match the approved SHA and successful main-branch gate." >&2
                exit 1
              fi
            fi
          else
            exhaustive="$(conclusion_for "$json" "Auditoría Exhaustiva QuickBite")"
            echo "Auditoría Exhaustiva QuickBite (SHA lookup) => $exhaustive" >&2
          fi

          # GitHub's run-list endpoint can lag briefly after a workflow_run completes.
          # Retry only missing evidence; never retry or override an explicit failed conclusion.
          for attempt in 1 2 3 4 5; do
            needs_refresh=false
            [ "$ci" = "missing" ] && needs_refresh=true
            if [ "$direct_audit" = false ] && [ "$exhaustive" = "missing" ]; then needs_refresh=true; fi
            [ "$needs_refresh" = true ] || break
            sleep "$attempt"
            json="$(fetch_runs)"
            if [ "$ci" = "missing" ]; then
              ci="$(conclusion_for "$json" "CI")"
              echo "CI retry $attempt => $ci" >&2
            fi
            if [ "$direct_audit" = false ] && [ "$exhaustive" = "missing" ]; then
              exhaustive="$(conclusion_for "$json" "Auditoría Exhaustiva QuickBite")"
              echo "Auditoría Exhaustiva QuickBite retry $attempt => $exhaustive" >&2
            fi
          done

          printf 'ci=%s\n' "$ci" >> "$GITHUB_OUTPUT"
          printf 'exhaustive=%s\n' "$exhaustive" >> "$GITHUB_OUTPUT"
          if [ "$ci" != "success" ] || [ "$exhaustive" != "success" ]; then
            echo "Acceptance evidence rejected: CI=$ci, exhaustive=$exhaustive, SHA=$SHA" >&2
            exit 1
          fi

  production-smoke:
    name: Production deployment smoke
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.smoke.outputs.reachable }}
    steps:
      - name: Validate production URL
        id: smoke
        env:
          URL: ${{ env.PRODUCTION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ["URL"])
          assert u.scheme == "https", "Production URL must use HTTPS"
          assert u.netloc, "Production URL must have a host"
          print(f"Production target: {u.geturl()}")
          PY

          status="$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 --retry 2 \
            --output /tmp/quickbite-production.html \
            --write-out '%{http_code}' "$URL")"

          test "$status" = "200"
          grep -qi "QuickBite" /tmp/quickbite-production.html
          echo "reachable=true" >> "$GITHUB_OUTPUT"

  integral-e2e:
    name: Integral cross-role acceptance
    needs: [resolve, production-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_E2E_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      PLAYWRIGHT_E2E_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
      PLAYWRIGHT_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
      PLAYWRIGHT_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_STAFF_EMAIL }}
      PLAYWRIGHT_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_STAFF_PASSWORD }}
      VITE_E2E_AUTH_AUTO_REFRESH: 'false'
      PLAYWRIGHT_BASE_URL: ${{ vars.K6_BASE_URL || 'https://quick-bite-snowy-ten.vercel.app' }}
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate acceptance credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY PLAYWRIGHT_E2E_EMAIL PLAYWRIGHT_E2E_PASSWORD PLAYWRIGHT_PARENT_EMAIL PLAYWRIGHT_PARENT_PASSWORD PLAYWRIGHT_STAFF_EMAIL PLAYWRIGHT_STAFF_PASSWORD PLAYWRIGHT_ADMIN_EMAIL PLAYWRIGHT_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Provision acceptance accounts
        run: node scripts/ensure-e2e-user.mjs

      - name: Verify no-cost manual nutrition draft workflow
        run: pnpm verify:nutrition-manual

      - name: Run dedicated integral acceptance suite
        run: >
          pnpm test:e2e
          tests/e2e/production-acceptance.spec.ts
          tests/e2e/critical-flows.spec.ts
          tests/e2e/role-interfaces.spec.ts
          --reporter=line

      - name: Upload acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quickbite-integral-acceptance-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  final:
    name: Production acceptance gate
    if: always()
    needs: [resolve, production-smoke, integral-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Calculate final acceptance result
        shell: bash
        run: |
          set -euo pipefail
          echo "SHA: ${{ needs.resolve.outputs.sha }}"
          echo "CI: ${{ needs.resolve.outputs.ci }}"
          echo "Exhaustive: ${{ needs.resolve.outputs.exhaustive }}"
          echo "Production smoke: ${{ needs.production-smoke.result }}"
          echo "Integral E2E: ${{ needs.integral-e2e.result }}"

          if [ "${{ needs.resolve.result }}" != "success" ] ||
             [ "${{ needs.production-smoke.result }}" != "success" ] ||
             [ "${{ needs.integral-e2e.result }}" != "success" ]; then
            echo "PRODUCTION APPROVAL: BLOCKED"
            exit 1
          fi

          if [ "${{ needs.resolve.outputs.ci }}" != "success" ] ||
             [ "${{ needs.resolve.outputs.exhaustive }}" != "success" ]; then
            echo "PRODUCTION APPROVAL: BLOCKED"
            exit 1
          fi

          echo "PRODUCTION ACCEPTANCE: PASS"
          echo "All required prior gates, production reachability, and integral acceptance checks passed for the same SHA. This certifies the defined acceptance suite, not every possible app behavior."
