name: QuickBite 400-User Full UI Functional Load Test

on:
  push:
    branches:
      - main
    paths:
      - 'tests/k6/**'
      - '.github/workflows/k6-load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickbite-k6-full-ui
  cancel-in-progress: true

jobs:
  browser:
    name: 400 browser VUs — 100 per interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      K6_BASE_URL: ${{ vars.K6_BASE_URL || 'https://quick-bite-snowy-ten.vercel.app' }}
      K6_STUDENT_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      K6_STUDENT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      K6_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
      K6_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
      K6_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_STAFF_EMAIL }}
      K6_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_STAFF_PASSWORD }}
      K6_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      K6_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision and validate four load-test accounts
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_E2E_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
          PLAYWRIGHT_E2E_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
          PLAYWRIGHT_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
          PLAYWRIGHT_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
          PLAYWRIGHT_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_STAFF_EMAIL }}
          PLAYWRIGHT_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_STAFF_PASSWORD }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY for safe account provisioning"; exit 1; }
          node scripts/ensure-e2e-user.mjs

      - name: Validate four role credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${K6_STUDENT_EMAIL}" || { echo "Missing Student load-test credential"; exit 1; }
          test -n "${K6_STUDENT_PASSWORD}" || { echo "Missing Student load-test password"; exit 1; }
          test -n "${K6_PARENT_EMAIL}" || { echo "Missing Parent load-test credential"; exit 1; }
          test -n "${K6_PARENT_PASSWORD}" || { echo "Missing Parent load-test password"; exit 1; }
          test -n "${K6_STAFF_EMAIL}" || { echo "Missing Staff load-test credential"; exit 1; }
          test -n "${K6_STAFF_PASSWORD}" || { echo "Missing Staff load-test password"; exit 1; }
          test -n "${K6_ADMIN_EMAIL}" || { echo "Missing Admin load-test credential"; exit 1; }
          test -n "${K6_ADMIN_PASSWORD}" || { echo "Missing Admin load-test password"; exit 1; }
          test -n "${VITE_SUPABASE_ANON_KEY}" || { echo "Missing Supabase anon/publishable key"; exit 1; }

      - name: Diagnose role authentication safely
        shell: bash
        run: |
          set -euo pipefail
          for role in STUDENT PARENT STAFF ADMIN; do
            email_var="K6_${role}_EMAIL"
            password_var="K6_${role}_PASSWORD"
            email="${!email_var}"
            password="${!password_var}"
            response_file="/tmp/k6-auth-${role}.json"
            payload=$(jq -n --arg email "${email}" --arg password "${password}" '{email:$email,password:$password}')
            status=$(curl -sS -o "${response_file}" -w '%{http_code}' \
              -X POST "${VITE_SUPABASE_URL}/auth/v1/token?grant_type=password" \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              --data "${payload}")
            code=$(jq -r '.error_code // .error // "none"' "${response_file}" 2>/dev/null || printf 'unparseable')
            message=$(jq -r '.msg // .message // ""' "${response_file}" 2>/dev/null || true)
            echo "${role}: HTTP ${status}; error_code=${code}; message=${message}"
            rm -f "${response_file}"
          done

      - name: Setup current Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Select CI-safe Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          chrome=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "${candidate}" >/dev/null 2>&1; then
              chrome="$(command -v "${candidate}")"
              break
            fi
          done

          if [ -z "${chrome}" ]; then
            echo "No system Chromium/Chrome executable is available on this runner."
            exit 1
          fi

          echo "K6_BROWSER_EXECUTABLE_PATH=${chrome}" >> "${GITHUB_ENV}"
          echo "Using system browser: ${chrome}"
          "${chrome}" --version || true

      - name: Run exhaustive 400-VU browser functional test
        shell: bash
        run: |
          set -euo pipefail
          test -n "${K6_BROWSER_EXECUTABLE_PATH}" || { echo "K6_BROWSER_EXECUTABLE_PATH was not configured"; exit 1; }
          k6 run tests/k6/quickbite-400-users.js
