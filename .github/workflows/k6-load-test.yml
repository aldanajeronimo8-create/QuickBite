name: QuickBite 400-User Functional Load Test

on:
  push:
    branches:
      - main
    paths:
      - 'tests/k6/**'
      - '.github/workflows/k6-load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    name: 400 virtual users — 100 per interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
      K6_BASE_URL: ${{ vars.K6_BASE_URL || 'https://quick-bite-snowy-ten.vercel.app' }}
      K6_STUDENT_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      K6_STUDENT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      K6_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
      K6_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
      K6_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_STAFF_EMAIL }}
      K6_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_STAFF_PASSWORD }}
      K6_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      K6_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      K6_USERS_FILE: /tmp/quickbite-k6-users.json
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate k6 credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${K6_STUDENT_EMAIL}" || { echo "Student k6 credential missing"; exit 1; }
          test -n "${K6_STUDENT_PASSWORD}" || { echo "Student k6 password missing"; exit 1; }
          test -n "${K6_PARENT_EMAIL}" || { echo "Parent k6 credential missing"; exit 1; }
          test -n "${K6_PARENT_PASSWORD}" || { echo "Parent k6 password missing"; exit 1; }
          test -n "${K6_STAFF_EMAIL}" || { echo "Staff k6 credential missing"; exit 1; }
          test -n "${K6_STAFF_PASSWORD}" || { echo "Staff k6 password missing"; exit 1; }
          test -n "${K6_ADMIN_EMAIL}" || { echo "Admin k6 credential missing"; exit 1; }
          test -n "${K6_ADMIN_PASSWORD}" || { echo "Admin k6 password missing"; exit 1; }
          test -n "${VITE_SUPABASE_ANON_KEY}" || { echo "Supabase anon key missing"; exit 1; }

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run 400-user functional load test
        uses: grafana/run-k6-action@v1
        with:
          path: ./tests/k6/quickbite-400-users.js
        env:
          K6_BASE_URL: ${{ env.K6_BASE_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          K6_STUDENT_EMAIL: ${{ env.K6_STUDENT_EMAIL }}
          K6_STUDENT_PASSWORD: ${{ env.K6_STUDENT_PASSWORD }}
          K6_PARENT_EMAIL: ${{ env.K6_PARENT_EMAIL }}
          K6_PARENT_PASSWORD: ${{ env.K6_PARENT_PASSWORD }}
          K6_STAFF_EMAIL: ${{ env.K6_STAFF_EMAIL }}
          K6_STAFF_PASSWORD: ${{ env.K6_STAFF_PASSWORD }}
          K6_ADMIN_EMAIL: ${{ env.K6_ADMIN_EMAIL }}
          K6_ADMIN_PASSWORD: ${{ env.K6_ADMIN_PASSWORD }}
