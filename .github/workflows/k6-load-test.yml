name: QuickBite k6 Load Test

on:
  push:
    branches:
      - main
    paths:
      - 'tests/k6/**'
      - '.github/workflows/k6-load-test.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    name: Run QuickBite k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke/load test
        uses: grafana/run-k6-action@v1
        with:
          path: ./tests/k6/quickbite-load.js
        env:
          K6_BASE_URL: ${{ vars.K6_BASE_URL || 'https://quick-bite-snowy-ten.vercel.app' }}
