name: QuickBite 400-User Functional Load Test

on:
  push:
    branches:
      - main
    paths:
      - 'tests/k6/**'
      - 'scripts/prepare-k6-role-accounts.mjs'
      - '.github/workflows/k6-load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    name: 400 virtual users — 100 per interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_E2E_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      PLAYWRIGHT_E2E_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      K6_BASE_URL: ${{ vars.K6_BASE_URL || 'https://quick-bite-snowy-ten.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate load-test credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_ANON_KEY}" || { echo "VITE_SUPABASE_ANON_KEY is missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          test -n "${PLAYWRIGHT_E2E_EMAIL}" || { echo "PLAYWRIGHT_E2E_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_E2E_PASSWORD}" || { echo "PLAYWRIGHT_E2E_PASSWORD is missing"; exit 1; }

      - name: Prepare four role identities
        run: node scripts/prepare-k6-role-accounts.mjs

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run 400-user functional load test
        uses: grafana/run-k6-action@v1
        with:
          path: ./tests/k6/quickbite-400-users.js
        env:
          K6_BASE_URL: ${{ env.K6_BASE_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          K6_STUDENT_EMAIL: ${{ env.K6_STUDENT_EMAIL }}
          K6_STUDENT_PASSWORD: ${{ env.K6_STUDENT_PASSWORD }}
          K6_PARENT_EMAIL: ${{ env.K6_PARENT_EMAIL }}
          K6_PARENT_PASSWORD: ${{ env.K6_PARENT_PASSWORD }}
          K6_STAFF_EMAIL: ${{ env.K6_STAFF_EMAIL }}
          K6_STAFF_PASSWORD: ${{ env.K6_STAFF_PASSWORD }}
          K6_ADMIN_EMAIL: ${{ env.K6_ADMIN_EMAIL }}
          K6_ADMIN_PASSWORD: ${{ env.K6_ADMIN_PASSWORD }}
