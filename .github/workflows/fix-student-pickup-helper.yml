name: Fix Student pickup helper
on:
  push:
    branches:
      - feat/liquid-glass-ui
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pickup helper if missing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/student/StudentMenuPage.tsx')
          s = p.read_text()
          marker = "  const futurePickupSlots = useMemo(() => {"
          block = """  const futurePickupSlots = useMemo(() => {\n    const now = new Date();\n    return pickupSlots.filter((slot) => {\n      const [hour, minute, second = 0] = slot.starts_at.split(':').map(Number);\n      const candidate = new Date();\n      candidate.setHours(hour, minute, second, 0);\n      return candidate.getTime() >= now.getTime();\n    });\n  }, [pickupSlots]);\n\n"""
          if marker not in s:
              needle = "  useEffect(() => {\n    let active = true;"
              if needle not in s:
                  raise SystemExit('insertion point not found')
              s = s.replace(needle, block + needle, 1)
              p.write_text(s)
          PY
      - name: Remove this workflow after repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-student-pickup-helper.yml
          git add src/app/pages/student/StudentMenuPage.tsx .github/workflows/fix-student-pickup-helper.yml
          git commit -m "fix: restore student pickup slot helper"
          git push
