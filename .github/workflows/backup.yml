name: Supabase backup

on:
  schedule:
    # 07:00 UTC = 02:00 in Colombia (UTC-5), every day.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PGSSLMODE: require

jobs:
  backup:
    name: Create and verify PostgreSQL backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          PG17_BIN="/usr/lib/postgresql/17/bin"
          test -x "${PG17_BIN}/pg_dump"
          test -x "${PG17_BIN}/pg_restore"
          test -x "${PG17_BIN}/pg_isready"
          "${PG17_BIN}/pg_dump" --version
          "${PG17_BIN}/pg_restore" --version
          "${PG17_BIN}/pg_isready" --version

      - name: Create compressed database backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL}" ]]; then
            echo "::error::Missing required GitHub Actions secret SUPABASE_DB_URL."
            exit 1
          fi

          PG17_BIN="/usr/lib/postgresql/17/bin"
          PG_DUMP="${PG17_BIN}/pg_dump"
          PG_RESTORE="${PG17_BIN}/pg_restore"
          PG_ISREADY="${PG17_BIN}/pg_isready"

          backup_dir="backups"
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          backup_file="${backup_dir}/quickbite-${timestamp}.dump"
          mkdir -p "${backup_dir}"

          connection_ok=false
          for attempt in 1 2 3; do
            if "${PG_ISREADY}" --dbname="${SUPABASE_DB_URL}" --timeout=10 >/dev/null 2>&1; then
              connection_ok=true
              break
            fi
            echo "Database readiness check failed (attempt ${attempt}/3). Retrying..."
            sleep $((attempt * 5))
          done
          if [[ "${connection_ok}" != true ]]; then
            echo "::error::Supabase PostgreSQL endpoint is not reachable with SUPABASE_DB_URL."
            exit 1
          fi

          dump_ok=false
          for attempt in 1 2 3; do
            if "${PG_DUMP}" \
              --dbname="${SUPABASE_DB_URL}" \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file="${backup_file}"; then
              dump_ok=true
              break
            fi
            echo "pg_dump failed (attempt ${attempt}/3). Removing partial dump and retrying..."
            rm -f "${backup_file}"
            sleep $((attempt * 5))
          done
          if [[ "${dump_ok}" != true ]]; then
            echo "::error::pg_dump could not create a valid Supabase backup after 3 attempts."
            exit 1
          fi

          test -s "${backup_file}"
          sha256sum "${backup_file}" > "${backup_file}.sha256"
          sha256sum --check "${backup_file}.sha256"
          "${PG_RESTORE}" --list "${backup_file}" > /dev/null

          echo "backup_dir=${backup_dir}" >> "${GITHUB_OUTPUT}"
          echo "backup_file=${backup_file}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickbite-postgres-${{ github.run_id }}
          path: ${{ steps.backup.outputs.backup_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Notify optional alert webhook on failure
        if: failure()
        env:
          QUICKBITE_ALERT_WEBHOOK_URL: ${{ secrets.QUICKBITE_ALERT_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${QUICKBITE_ALERT_WEBHOOK_URL}" ]]; then exit 0; fi
          curl --fail --silent --show-error --max-time 15 --retry 2 \
            -H 'Content-Type: application/json' \
            --data '{"text":"QuickBite: el backup de Supabase falló. Revisa el workflow de GitHub Actions."}' \
            "${QUICKBITE_ALERT_WEBHOOK_URL}" || true
