name: QuickBite Auto-Heal

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickbite-auto-heal
  cancel-in-progress: true

env:
  QUICKBITE_PRODUCTION_URL: https://quick-bite-snowy-ten.vercel.app/
  VERCEL_ORG_ID: team_RO7iBCvGd2vw4GbiV9vthNdh
  VERCEL_PROJECT_ID: prj_Udwcqe1402DfGaXdIFOIO3pTFf5f

jobs:
  production-watchdog:
    name: Production watchdog and rollback
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      QUICKBITE_HEALTH_URL: ${{ secrets.QUICKBITE_HEALTH_URL }}
      QUICKBITE_HEALTH_TOKEN: ${{ secrets.QUICKBITE_HEALTH_TOKEN }}
      QUICKBITE_ALERT_WEBHOOK_URL: ${{ secrets.QUICKBITE_ALERT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run production smoke checks
        id: smoke
        continue-on-error: true
        run: node scripts/auto-heal-smoke.mjs
      - name: Recheck after transient failure
        id: retry
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            sleep 15
            if node scripts/auto-heal-smoke.mjs; then exit 0; fi
          done
          exit 1
      - name: Prepare Vercel project context
        id: prepare
        if: steps.smoke.outcome == 'failure' && steps.retry.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is missing; automatic rollback is unavailable."
            exit 0
          fi
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          chmod 600 .vercel/project.json
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Roll back immediately to previous production deployment
        id: rollback
        if: steps.prepare.outputs.enabled == 'true'
        continue-on-error: true
        run: npx --yes vercel@latest rollback --yes --token "$VERCEL_TOKEN"
      - name: Verify service after rollback
        id: rollback_verify
        if: steps.prepare.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sleep 10
            if node scripts/auto-heal-smoke.mjs; then exit 0; fi
          done
          exit 1
      - name: Fail only on unresolved production incident
        if: steps.smoke.outcome == 'failure' && steps.retry.outcome == 'failure' && (steps.prepare.outputs.enabled != 'true' || steps.rollback.outcome == 'failure' || steps.rollback_verify.outcome == 'failure')
        run: exit 1
      - name: Alert on unresolved production incident
        if: steps.smoke.outcome == 'failure' && steps.retry.outcome == 'failure' && (steps.prepare.outputs.enabled != 'true' || steps.rollback.outcome == 'failure' || steps.rollback_verify.outcome == 'failure')
        run: |
          set -euo pipefail
          if [[ -z "${QUICKBITE_ALERT_WEBHOOK_URL}" ]]; then
            echo "::error::No Discord webhook configured. Set QUICKBITE_ALERT_WEBHOOK_URL (or DISCORD_WEBHOOK_URL) in GitHub Actions secrets."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            --data '{"content":"🚨 QuickBite Auto-Heal: incidente de producción no resuelto. Se intentó recuperación/rollback. Revisar GitHub y Vercel."}' \
            "${QUICKBITE_ALERT_WEBHOOK_URL}"

  ai-repair:
    name: AI diagnosis and repair PR
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CLI_TRUST_WORKSPACE: true
      VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_E2E_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      PLAYWRIGHT_E2E_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QUICKBITE_ALERT_WEBHOOK_URL: ${{ secrets.QUICKBITE_ALERT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
      CI: true
    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Create repair branch
        run: git switch -c "auto-heal/ci-${{ github.event.workflow_run.id }}"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Capture failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p .github/auto-heal
          gh run view "$RUN_ID" --log-failed > .github/auto-heal/ci-failure.log || true
          test -s .github/auto-heal/ci-failure.log || printf 'No failed log output was returned.\n' > .github/auto-heal/ci-failure.log
      - name: Run Codex repair agent
        id: codex
        if: env.OPENAI_API_KEY != ''
        continue-on-error: true
        timeout-minutes: 8
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            Diagnose .github/auto-heal/ci-failure.log and make the smallest safe repair.
            Never weaken tests, modify secrets, disable CI, or deploy.
            Preserve order, stock, payment, auth, RLS, backups and Auto-Heal.
            Run typecheck, lint, test and build; run E2E when secrets are available.
      - name: Run Gemini fallback repair/review
        id: gemini
        if: env.GEMINI_API_KEY != '' && (steps.codex.outcome != 'success' || env.OPENAI_API_KEY == '')
        continue-on-error: true
        timeout-minutes: 8
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ env.GEMINI_API_KEY }}
          prompt: |
            Codex did not complete successfully or is unavailable, so you are the fallback repair agent.
            Inspect .github/auto-heal/ci-failure.log and the current git diff.
            Diagnose and repair the root cause with the smallest safe change.
            Never weaken tests, change secrets, disable CI or deploy.
            Run typecheck, lint, test and build before finishing when practical.
      - name: Stop if no AI repair provider is configured
        if: env.OPENAI_API_KEY == '' && env.GEMINI_API_KEY == ''
        run: |
          echo "::error::No AI repair provider is configured."
          exit 1
      - name: Re-run quality checks after AI repair
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          if [[ -n "${PLAYWRIGHT_E2E_EMAIL}" && -n "${PLAYWRIGHT_E2E_PASSWORD}" && -n "${SUPABASE_SERVICE_ROLE_KEY}" && -n "${VITE_SUPABASE_ANON_KEY}" ]]; then
            node scripts/ensure-e2e-user.mjs
            pnpm test:e2e
          else
            echo "E2E secrets unavailable; normal CI remains the final gate."
          fi
      - name: Commit and push repair branch
        id: push
        run: |
          set -euo pipefail
          git config user.name 'quickbite-auto-heal[bot]'
          git config user.email 'quickbite-auto-heal[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes were produced.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix(auto-heal): repair failed CI run ${{ github.event.workflow_run.run_number }}"
          git push --set-upstream origin HEAD
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Open repair pull request
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: auto-heal/ci-${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh pr create --base main --head "$HEAD_BRANCH" --title "fix(auto-heal): repair CI failure #${{ github.event.workflow_run.run_number }}" --body "Automated repair proposal for failed CI run $RUN_ID. Production deployment is not performed by Auto-Heal."
      - name: Alert if AI repair failed
        if: failure()
        run: |
          set -euo pipefail
          if [[ -z "${QUICKBITE_ALERT_WEBHOOK_URL}" ]]; then
            echo "::error::AI repair failed and no Discord webhook is configured."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            --data '{"content":"⚠️ QuickBite Auto-Heal: la reparación automática de CI falló. Revisar la ejecución de GitHub Actions."}' \
            "${QUICKBITE_ALERT_WEBHOOK_URL}"
