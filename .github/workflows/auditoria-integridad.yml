# Stage 3: starts automatically after a successful exhaustive audit and audits that exact SHA.
name: Auditoría de Integridad QuickBite

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to audit'
        required: false
        type: string
  workflow_run:
    workflows: ['Auditoría Exhaustiva QuickBite']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: quickbite-integrity-audit-${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  integrity-trigger:
    name: Validate exhaustive audit gate
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - name: Resolve exact exhaustive-audit SHA
        id: resolve-sha
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}"
          test -n "$sha"
          echo "Auditing exact exhaustive SHA: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  database-integrity:
    name: Live database integrity
    needs: integrity-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_SHA: ${{ needs.integrity-trigger.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrity-trigger.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate service credentials
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Run live relational, order, payment, inventory and export assertions
        run: node scripts/integrity-audit.mjs

  export-contract:
    name: Excel export contract
    needs: integrity-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrity-trigger.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Excel-only implementation
        run: pnpm verify:excel-only
      - name: Run export service tests
        run: pnpm test -- src/services/orderExportService.test.ts

  final:
    name: Auditoría de integridad final
    if: always()
    needs: [integrity-trigger, database-integrity, export-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate integrity stages
        shell: bash
        run: |
          set -euo pipefail
          echo "Trigger: ${{ needs.integrity-trigger.result }}"
          echo "Database: ${{ needs.database-integrity.result }}"
          echo "Excel: ${{ needs.export-contract.result }}"
          if [ "${{ needs.integrity-trigger.result }}" != "success" ] || [ "${{ needs.database-integrity.result }}" != "success" ] || [ "${{ needs.export-contract.result }}" != "success" ]; then
            echo "AUDITORÍA DE INTEGRIDAD: FAIL"; exit 1
          fi
          echo "AUDITORÍA DE INTEGRIDAD: PASS"
