name: Temporary legacy export patch
on:
  push:
    branches:
      - fix/admin-student-stability
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy admin export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/pages/admin/AdminOrders.tsx')
          s=p.read_text()
          old='const result = downloadActiveSalesExcel(orders);'
          new='const result = await downloadActiveSalesExcel(orders);'
          if old not in s:
              raise SystemExit('legacy export call not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/await-legacy-export.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/admin/AdminOrders.tsx .github/workflows/await-legacy-export.yml
          git commit -m "fix: await legacy admin excel export"
          git push
