name: Vercel Production Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel production deployment
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_DEPLOY_HOOK_URL" || {
            echo "VERCEL_DEPLOY_HOOK_URL is missing in GitHub repository secrets."
            exit 1
          }
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Vercel production deployment triggered successfully."
