name: Vercel Production Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Deploy to Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_RO7iBCvGd2vw4GbiV9vthNdh
          VERCEL_PROJECT_ID: prj_Udwcqe1402DfGaXdIFOIO3pTFf5f
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN" || {
            echo "VERCEL_TOKEN is missing in GitHub repository secrets."
            echo "The deployment cannot be created without a Vercel API token."
            exit 1
          }

          npx --yes vercel@latest deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID"
