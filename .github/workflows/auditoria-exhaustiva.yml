# Stage 2: starts automatically after a successful CI run and audits that exact CI SHA.
name: Auditoría Exhaustiva QuickBite

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to audit'
        required: false
        type: string
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: quickbite-exhaustive-audit-${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
  K6_BASE_URL: ${{ vars.K6_BASE_URL || 'https://quick-bite-snowy-ten.vercel.app' }}

jobs:
  audit-trigger:
    name: Validate CI gate
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - name: Resolve exact CI SHA
        id: resolve-sha
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}"
          test -n "$sha"
          echo "Auditing exact CI SHA: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  k6-browser:
    name: K6 ${{ matrix.role }}
    needs: audit-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        role: [student, parent, staff, admin]
    env:
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      K6_BROWSER_ROLE: ${{ matrix.role }}
      K6_BROWSER_VUS: 1
      K6_BROWSER_ITERATIONS: 1
      K6_STUDENT_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      K6_STUDENT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      K6_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
      K6_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
      K6_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_STAFF_EMAIL }}
      K6_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_STAFF_PASSWORD }}
      K6_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      K6_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
    steps:
      - name: Checkout exact CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.audit-trigger.outputs.sha }}
      - name: Install K6
        uses: grafana/setup-k6-action@v1
      - name: Select Chromium
        shell: bash
        run: |
          set -euo pipefail
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "K6_BROWSER_EXECUTABLE_PATH=$(command -v "$c")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Chromium/Chrome executable found"
          exit 1
      - name: Audit interface, controls, forms, links and browser errors
        run: k6 run --summary-export="k6-${{ matrix.role }}-summary.json" tests/k6/quickbite-400-users.js
      - name: Upload K6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-audit-${{ matrix.role }}
          path: k6-${{ matrix.role }}-summary.json
          if-no-files-found: warn

  e2e-exhaustive:
    name: Playwright E2E exhaustive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: k6-browser
    env:
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_E2E_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      PLAYWRIGHT_E2E_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      PLAYWRIGHT_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
      PLAYWRIGHT_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
      PLAYWRIGHT_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_STAFF_EMAIL }}
      PLAYWRIGHT_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_STAFF_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
    steps:
      - name: Checkout exact CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.audit-trigger.outputs.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Authorize required pnpm build scripts
        run: pnpm approve-builds @tailwindcss/oxide esbuild
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate required audit credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in PLAYWRIGHT_E2E_EMAIL PLAYWRIGHT_E2E_PASSWORD PLAYWRIGHT_PARENT_EMAIL PLAYWRIGHT_PARENT_PASSWORD PLAYWRIGHT_STAFF_EMAIL PLAYWRIGHT_STAFF_PASSWORD PLAYWRIGHT_ADMIN_EMAIL PLAYWRIGHT_ADMIN_PASSWORD VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
      - name: Provision E2E accounts
        run: node scripts/ensure-e2e-user.mjs
      - name: Run all E2E functional, role, permission and regression checks
        run: pnpm test:e2e
        env:
          CI: true
          VITE_E2E_AUTH_AUTO_REFRESH: 'false'
        env:
          CI: true
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-exhaustive-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  quality:
    name: Static, unit and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-exhaustive
    steps:
      - name: Checkout exact CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.audit-trigger.outputs.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Authorize required pnpm build scripts
        run: pnpm approve-builds @tailwindcss/oxide esbuild
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Excel-only export guard
        run: pnpm verify:excel-only
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  exhaustive-audit-result:
    name: Auditoría exhaustiva final
    runs-on: ubuntu-latest
    if: always()
    needs: [audit-trigger, k6-browser, e2e-exhaustive, quality]
    steps:
      - name: Evaluate audit stages
        shell: bash
        run: |
          set -euo pipefail
          echo "Trigger: ${{ needs.audit-trigger.result }}"
          echo "K6 result: ${{ needs.k6-browser.result }}"
          echo "Playwright result: ${{ needs.e2e-exhaustive.result }}"
          echo "Quality result: ${{ needs.quality.result }}"
          if [ "${{ needs.audit-trigger.result }}" != "success" ] || [ "${{ needs.k6-browser.result }}" != "success" ] || [ "${{ needs.e2e-exhaustive.result }}" != "success" ] || [ "${{ needs.quality.result }}" != "success" ]; then
            echo "AUDITORÍA EXHAUSTIVA: FAIL"
            exit 1
          fi
          echo "AUDITORÍA EXHAUSTIVA: PASS"
