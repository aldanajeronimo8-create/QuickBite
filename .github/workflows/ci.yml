name: CI
# Main quality and E2E gate for the QuickBite pipeline.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep at most one running main CI plus one latest pending run.
  # A running main CI is never canceled; obsolete pending runs are replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Excel-only export guard
        run: pnpm verify:excel-only

      - name: No-cost nutrition draft guard
        run: pnpm verify:nutrition-manual

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build


  migration-gate-smoke:
    name: Migration gate smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QB_ADMIN_GATE_URL: https://arvvkukyvcqxyqkvqmaf.supabase.co/functions/v1/qb-admin-migration-gate
    steps:
      - name: Inspect deployed runtime configuration without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          health_code="$(curl --silent --show-error -o /tmp/qb-gate-health.json -w "%{http_code}" \
            --retry 2 --retry-delay 2 "${QB_ADMIN_GATE_URL}/health")"
          if [[ "$health_code" != "200" ]]; then
            echo "::error::Public read-only health route returned HTTP $health_code."
            cat /tmp/qb-gate-health.json
            exit 1
          fi
          health="$(cat /tmp/qb-gate-health.json)"
          report="$(E2E_GATE_HEALTH="$health" node <<'NODE'
          const input = JSON.parse(process.env.E2E_GATE_HEALTH ?? "{}");
          const safe = {
            status: input.status,
            destinationRuntimeConfigured: input.destinationRuntimeConfigured === true,
            allowedOriginsConfigured: input.allowedOriginsConfigured === true,
            sourceConnectionConfigured: input.sourceConnectionConfigured === true,
            migrationExecuted: input.migrationExecuted === true,
          };
          const missing = [
            "destinationRuntimeConfigured",
            "allowedOriginsConfigured",
            "sourceConnectionConfigured",
          ].filter((key) => safe[key] !== true);
          process.stdout.write(JSON.stringify({ safe, missing }));
          NODE
          )"
          echo "Read-only gate health: $report"
          status_code="$(curl --silent --show-error -o /tmp/qb-gate-status.json -w "%{http_code}" \
            "${QB_ADMIN_GATE_URL}/status")"
          if [[ "$status_code" != "401" ]]; then
            echo "::error::Unauthenticated /status must return 401 (got $status_code)."
            cat /tmp/qb-gate-status.json
            exit 1
          fi
          cors_code="$(curl --silent --show-error -o /tmp/qb-gate-cors.json -w "%{http_code}" \
            -H "Origin: https://example.invalid" "${QB_ADMIN_GATE_URL}/health")"
          if [[ "$cors_code" != "403" ]]; then
            echo "::error::Untrusted origins must be rejected (got $cors_code)."
            cat /tmp/qb-gate-cors.json
            exit 1
          fi
          missing="$(E2E_GATE_REPORT="$report" node -e 'process.stdout.write(JSON.parse(process.env.E2E_GATE_REPORT ?? "{}").missing.join(", "))')"
          if [[ -n "$missing" ]]; then
            echo "::error::Migration remains blocked; incomplete runtime settings: $missing"
            exit 1
          fi
          echo "Live gate behavior verified: health reachable, admin status protected, untrusted Origin rejected."

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # 120 Playwright tests run serially with up to 2 retries; the previous 20m cap killed valid runs mid-suite.
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_E2E_EMAIL: ${{ secrets.E2E_PLAYWRIGHT_E2E_EMAIL }}
      PLAYWRIGHT_E2E_PASSWORD: ${{ secrets.E2E_PLAYWRIGHT_E2E_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.E2E_PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.E2E_PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_PARENT_EMAIL: ${{ secrets.E2E_PLAYWRIGHT_PARENT_EMAIL }}
      PLAYWRIGHT_PARENT_PASSWORD: ${{ secrets.E2E_PLAYWRIGHT_PARENT_PASSWORD }}
      PLAYWRIGHT_STAFF_EMAIL: ${{ secrets.E2E_PLAYWRIGHT_STAFF_EMAIL }}
      PLAYWRIGHT_STAFF_PASSWORD: ${{ secrets.E2E_PLAYWRIGHT_STAFF_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      CI: true
      VITE_E2E_AUTH_AUTO_REFRESH: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Refuse non-isolated E2E target
        shell: bash
        run: |
          set -euo pipefail
          expected="https://arvvkukyvcqxyqkvqmaf.supabase.co"
          actual="${VITE_SUPABASE_URL%/}"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::E2E blocked before any writes: configure dedicated E2E project URL, keys, and E2E-only accounts."
            exit 1
          fi
          if [[ "$actual" == "https://cczbbqxunygcowqfrqdm.supabase.co" ]]; then
            echo "::error::E2E must never target source production."
            exit 1
          fi

      - name: Validate E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_ANON_KEY}" || { echo "VITE_SUPABASE_ANON_KEY is missing"; exit 1; }
          test -n "${PLAYWRIGHT_E2E_EMAIL}" || { echo "PLAYWRIGHT_E2E_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_E2E_PASSWORD}" || { echo "PLAYWRIGHT_E2E_PASSWORD is missing"; exit 1; }
          test -n "${PLAYWRIGHT_PARENT_EMAIL}" || { echo "PLAYWRIGHT_PARENT_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_PARENT_PASSWORD}" || { echo "PLAYWRIGHT_PARENT_PASSWORD is missing"; exit 1; }
          test -n "${PLAYWRIGHT_STAFF_EMAIL}" || { echo "PLAYWRIGHT_STAFF_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_STAFF_PASSWORD}" || { echo "PLAYWRIGHT_STAFF_PASSWORD is missing"; exit 1; }
          test -n "${PLAYWRIGHT_ADMIN_EMAIL}" || { echo "PLAYWRIGHT_ADMIN_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_ADMIN_PASSWORD}" || { echo "PLAYWRIGHT_ADMIN_PASSWORD is missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }

      - name: Provision E2E user
        run: node scripts/ensure-e2e-user.mjs

      - name: Prepare deterministic E2E purchase data
        run: node scripts/prepare-e2e-data.mjs

      - name: Run Playwright E2E
        run: pnpm test:e2e

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
