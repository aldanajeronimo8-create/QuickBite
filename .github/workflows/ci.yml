name: CI
# Main quality and E2E gate for the QuickBite pipeline.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep at most one running main CI plus one latest pending run.
  # A running main CI is never canceled; obsolete pending runs are replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Excel-only export guard
        run: pnpm verify:excel-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # 120 Playwright tests run serially with up to 2 retries; the previous 20m cap killed valid runs mid-suite.
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://cczbbqxunygcowqfrqdm.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_E2E_EMAIL: ${{ secrets.PLAYWRIGHT_E2E_EMAIL }}
      PLAYWRIGHT_E2E_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_PASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_PARENT_EMAIL: ${{ secrets.PLAYWRIGHT_PARENT_EMAIL }}
      PLAYWRIGHT_PARENT_PASSWORD: ${{ secrets.PLAYWRIGHT_PARENT_PASSWORD }}
      PLAYWRIGHT_STAFF_EMAIL: ${{ secrets.PLAYWRIGHT_STAFF_EMAIL }}
      PLAYWRIGHT_STAFF_PASSWORD: ${{ secrets.PLAYWRIGHT_STAFF_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CI: true
      VITE_E2E_AUTH_AUTO_REFRESH: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_ANON_KEY}" || { echo "VITE_SUPABASE_ANON_KEY is missing"; exit 1; }
          test -n "${PLAYWRIGHT_E2E_EMAIL}" || { echo "PLAYWRIGHT_E2E_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_E2E_PASSWORD}" || { echo "PLAYWRIGHT_E2E_PASSWORD is missing"; exit 1; }
          test -n "${PLAYWRIGHT_PARENT_EMAIL}" || { echo "PLAYWRIGHT_PARENT_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_PARENT_PASSWORD}" || { echo "PLAYWRIGHT_PARENT_PASSWORD is missing"; exit 1; }
          test -n "${PLAYWRIGHT_STAFF_EMAIL}" || { echo "PLAYWRIGHT_STAFF_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_STAFF_PASSWORD}" || { echo "PLAYWRIGHT_STAFF_PASSWORD is missing"; exit 1; }
          test -n "${PLAYWRIGHT_ADMIN_EMAIL}" || { echo "PLAYWRIGHT_ADMIN_EMAIL is missing"; exit 1; }
          test -n "${PLAYWRIGHT_ADMIN_PASSWORD}" || { echo "PLAYWRIGHT_ADMIN_PASSWORD is missing"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }

      - name: Provision E2E user
        run: node scripts/ensure-e2e-user.mjs

      - name: Prepare deterministic E2E purchase data
        run: node scripts/prepare-e2e-data.mjs

      - name: Run Playwright E2E
        run: pnpm test:e2e

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
